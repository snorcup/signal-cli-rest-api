version: "3.9"

services:
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-cli
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - signal_cli_data:/home/.local/share/signal-cli
    environment:
      - MODE=json-rpc
      - PORT=8085

volumes:
  signal_cli_data:
