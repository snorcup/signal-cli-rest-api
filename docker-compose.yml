version: "3"
services:
  signal-cli-rest-api:
    image: snorcup/signal-cli-rest-api:latest
    environment:
      - MODE=json-rpc #supported modes: json-rpc, native, normal
      #- AUTO_RECEIVE_SCHEDULE=0 22 * * * #enable this parameter on demand (see description below)
    ports:
      - "8180:8180" #map docker port 8080 to host port 8080.
    volumes:
      - "signal-cli-rest-api:/" #map "signal-cli-config" folder on host system into docker container. the folder contains the password and cryptographic keys when a new number is registered
