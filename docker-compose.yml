version: "3.9"

services:
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-cli
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - signal_cli_data:/home/.local/share/signal-cli
    labels:
      traefik.enable: "true"
      traefik.http.routers.signal.rule: "Host(`signal.51fifty.io`)"
      traefik.http.routers.signal.entrypoints: "websecure"
      traefik.http.routers.signal.tls.certresolver: "letsencrypt"
      traefik.http.services.signal.loadbalancer.server.port: "8085"
    environment:
      - MODE=json-rpc
      - PORT=8085

volumes:
  signal_cli_data:
